document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

tyle=\"font-size:13px;color:#6B6062;margin-top:4px\">Primer cene, potvrđuje se pri zakazivanju<\u002Fdiv><\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:20px\">\n          <a href=\"#\" sc-camel-on-click=\"{{ svc.book }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;background:#A8475F;color:#FFFFFF;font-weight:700;font-size:16px\" style-hover=\"background:#8A3A4F;color:#FFFFFF\">Zakažite ovaj pregled<\u002Fa>\n          <a href=\"tel:+38163380252\" style=\"display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;background:#2B2526;color:#FFFFFF;font-weight:700;font-size:16px\" style-hover=\"background:#463D3F;color:#FFFFFF\">Pozovite 063 380 252<\u002Fa>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:8px;align-items:center;margin-top:18px;font-size:14px;color:#463D3F\"><span style=\"width:8px;height:8px;border-radius:50%;flex:none;background: {{ status.dot }}\"><\u002Fspan>{{ status.text }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Faside>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- NAŠ TIM (spojeno sa O nama) -->\n<sc-if value=\"{{ pg.team }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Naš tim\" style=\"max-width:1280px;margin:0 auto;padding:20px clamp(16px,4cqi,48px) clamp(56px,7cqi,96px)\">\n  <nav aria-label=\"Putanja\" style=\"display:flex;gap:8px;font-size:14px;color:#6B6062\"><a href=\"#\" sc-camel-on-click=\"{{ goHome }}\">Naslovna<\u002Fa><span>/<\u002Fspan><span style=\"color:#2B2526\">Naš tim<\u002Fspan><\u002Fnav>\n  <h1 style=\"margin:clamp(20px,3cqi,32px) 0 0;font-size:clamp(36px,5cqi,64px);line-height:1.02;letter-spacing:-0.03em;font-weight:800\">Naš tim<\u002Fh1>\n  <p style=\"font-size:18px;line-height:1.6;max-width:56ch;margin:14px 0 0;color:#6B6062\">Izaberite lekara da vidite koje preglede radi i zakažete termin kod njega.<\u002Fp>\n  <div role=\"group\" aria-label=\"Oblast\" style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:24px\">\n    <sc-for list=\"{{ teamFilters }}\" as=\"t\" hint-placeholder-count=\"4\">\n      <button type=\"button\" sc-camel-on-click=\"{{ t.pick }}\" aria-pressed=\"{{ t.pressed }}\" style=\"padding:10px 16px;border-radius:999px;border:1px solid #EAE1DC;cursor:pointer;font-size:14px;font-weight:600;background: {{ t.bg }}; color: {{ t.fg }}\">{{ t.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,230px),1fr));gap:28px 16px;margin-top:28px\">\n    <sc-for list=\"{{ teamList }}\" as=\"d\" hint-placeholder-count=\"8\">\n      <a href=\"#\" sc-camel-on-click=\"{{ d.go }}\" style=\"color:#2B2526;display:flex;flex-direction:column\" style-hover=\"color:#8A3A4F\">\n        <img loading=\"lazy\" decoding=\"async\" src=\"{{ d.img }}\" alt=\"{{ d.name }}\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:20px;display:block;background:#EAE1DC\">\n        <div style=\"font-weight:700;font-size:16px;line-height:1.25;margin-top:12px\">{{ d.name }}<\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.4;margin-top:4px;color:#6B6062\">{{ d.title }}<\u002Fdiv>\n      <\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <section style=\"margin-top:clamp(56px,7cqi,96px);background:#F1EAE2;border-radius:32px;padding:clamp(24px,4cqi,48px);display:grid;grid-template-columns: {{ L.letter }};gap:clamp(24px,4cqi,48px);align-items:start\">\n    <img loading=\"lazy\" decoding=\"async\" src=\"https://www.materna.rs/images/nas-tim/aleksandar-azanjac.jpg\" alt=\"Dr Aleksandar Azanjac\" style=\"width:100%;max-width:340px;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:24px;display:block;background:#EAE1DC\">\n    <div style=\"min-width:0;max-width:66ch\">\n      <h2 style=\"margin:0;font-size:clamp(26px,3cqi,36px);letter-spacing:-0.02em;font-weight:800\">Reč osnivača<\u002Fh2>\n      <p style=\"font-size:17px;line-height:1.75;margin:16px 0 0\"><strong>Poštovani pacijenti,<\u002Fstrong> nadam se da će te pomoću novog sajta koji prezentuje usluge sada već Poliklinike Materna, pronaći deo odgovora na vaša pitanja i nedoumice, a siguran sam da će stručni tim ove poliklinike profesionalnim i stručnim pristupom u radu zadobiti vaše poverenje. Kao vlasnik ove zdravstvene ustanove želim da se zahvalim na višedecenijskom poverenju vernim pacijentima i poželim dobrodošlicu svim novim pacijentima kojima je potrebna pomoć iz oblasti ginekologije i akušerstva, pedijatrije, interne medicine, radiologije. Savremeni medicinski aparati su u rukama stručnjaka, tako da sa neskromnim stavom i željama krećemo u zajedničke pobede.<\u002Fp>\n      <p style=\"font-size:17px;line-height:1.6;margin:16px 0 0\">Dobro zdravlje želi vam<br><strong>Dr Aleksandar Azanjac<\u002Fstrong><\u002Fp>\n      <h3 style=\"margin:32px 0 0;font-size:19px;font-weight:800\">Kontinuirana medicinska edukacija<\u002Fh3>\n      <p style=\"font-size:16px;line-height:1.7;margin:8px 0 0;color:#463D3F\">Naš cilj je stalno praćenje medicine, sticanje novih znanja i veština i unapređenje zdravstvene zaštite naših pacijenata. U tom smislu redovni smo u pohađanju kurseva, seminara, online medicinskih škola.<\u002Fp>\n      <div style=\"display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;align-items:center\">\n        <img loading=\"lazy\" decoding=\"async\" src=\"https://www.materna.rs/images/boonshoft-school-of-medecine.jpg\" alt=\"Boonshoft School of Medicine\" style=\"height:52px;width:auto;display:block;border-radius:10px\">\n        <img loading=\"lazy\" decoding=\"async\" src=\"https://www.materna.rs/images/fmf.jpg\" alt=\"The Fetal Medicine Foundation\" style=\"height:52px;width:auto;display:block;border-radius:10px\">\n        <span style=\"padding:12px 16px;border-radius:999px;background:#FFFFFF;font-size:14px;font-weight:700\">ISUOG član<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<!-- PROFIL LEKARA -->\n<sc-if value=\"{{ pg.doctor }}\" hint-placeholder-val=\"{{ false }}\">\n<div data-screen-label=\"Profil lekara\" style=\"max-width:1280px;margin:0 auto;padding:20px clamp(16px,4cqi,48px) clamp(56px,7cqi,96px)\">\n  <nav aria-label=\"Putanja\" style=\"display:flex;gap:8px;flex-wrap:wrap;font-size:14px;color:#6B6062\"><a href=\"#\" sc-camel-on-click=\"{{ goHome }}\">Naslovna<\u002Fa><span>/<\u002Fspan><a href=\"#\" sc-camel-on-click=\"{{ goTeam }}\">Naš tim<\u002Fa><span>/<\u002Fspan><span style=\"color:#2B2526\">{{ doc.name }}<\u002Fspan><\u002Fnav>\n  <div style=\"display:grid;grid-template-columns: {{ L.letter }};gap:clamp(24px,4cqi,56px);margin-top:clamp(20px,3cqi,32px);align-items:start\">\n    <div style=\"min-width:0\">\n      <img loading=\"lazy\" decoding=\"async\" src=\"{{ doc.img }}\" alt=\"{{ doc.name }}\" style=\"width:100%;aspect-ratio:4/5;object-fit:cover;object-position:top;border-radius:28px;display:block;background:#EAE1DC\">\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-top:14px\">\n        <a href=\"#\" sc-camel-on-click=\"{{ doc.book }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;background:#A8475F;color:#FFFFFF;font-weight:700;font-size:16px;text-align:center;padding:0 16px\" style-hover=\"background:#8A3A4F;color:#FFFFFF\">Zakažite kod ovog lekara<\u002Fa>\n        <a href=\"tel:+38163380252\" style=\"display:flex;align-items:center;justify-content:center;min-height:54px;border-radius:999px;background:#2B2526;color:#FFFFFF;font-weight:700;font-size:16px\" style-hover=\"background:#463D3F;color:#FFFFFF\">Pozovite 063 380 252<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"min-width:0\">\n      <h1 style=\"margin:0;font-size:clamp(32px,4.2cqi,54px);line-height:1.05;letter-spacing:-0.03em;font-weight:800\">{{ doc.name }}<\u002Fh1>\n      <div style=\"font-size:19px;line-height:1.45;margin-top: <h1 style=\"margin:0;font-size:clamp(36px,5cqi,64px);line-height:1.02;letter-spacing:-0.03em;font-weight:800\">Cenovnik<\u002Fh1>\n    <div style=\"flex:1;max-width:440px;min-width:min(100%,260px)\">\n      <label for=\"price-q\" style=\"display:block;font-size:14px;font-weight:600;margin-bottom:6px\">Pretražite cenovnik<\u002Flabel>\n      <input id=\"price-q\" placeholder=\"npr. ultrazvuk, fileri\" value=\"{{ priceQ }}\" sc-camel-on-change=\"{{ setPriceQ }}\" style=\"width:100%;min-height:50px;padding:0 18px;border:1px solid #EAE1DC;border-radius:999px;background:#FFFFFF;font-size:16px;color:#2B2526\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ showTodo }}\" hint-placeholder-val=\"{{ true }}\">\n    <p style=\"margin:18px 0 0;padding:14px 18px;border-radius:16px;background:#F1EAE2;font-size:14px;line-height:1.55;max-width:80ch\">Cene označene sa „primer cene“ su privremene i biće zamenjene važećim cenovnikom. Cene urologije i plastične hirurgije su važeće.<\u002Fp>\n  <\u002Fsc-if>\n  <div style=\"position:sticky;top: {{ L.stickyTop }};z-index:5;background:#FAF8F5;display:flex;gap:8px;overflow-x:auto;margin-top:20px;padding:10px 0\">\n    <sc-for list=\"{{ priceTabs }}\" as=\"t\" hint-placeholder-count=\"8\">\n      <a href=\"#\" sc-camel-on-click=\"{{ t.go }}\" style=\"flex:none;padding:9px 14px;border-radius:999px;border:1px solid #EAE1DC;background:#FFFFFF;font-size:14px;font-weight:600;white-space:nowrap;color:#2B2526\" style-hover=\"background:#F6E6E8;color:#6E2E40\">{{ t.label }}<\u002Fa>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-direction:column;gap:16px;margin-top:12px\">\n    <sc-for list=\"{{ priceGroups }}\" as=\"g\" hint-placeholder-count=\"4\">\n      <section id=\"{{ g.anchor }}\" style=\"background:#FFFFFF;border:1px solid #EAE1DC;border-radius:24px;overflow:hidden\">\n        <div style=\"display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:20px 22px 12px\">\n          <h2 style=\"margin:0;font-size:2 =\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg>ordinacija@materna.rs<\u002Fa>\n      <a href=\"https://www.instagram.com/poliklinika_materna/\" target=\"_blank\" style=\"display:flex;gap:10px;align-items:center;color:#EDE6E1\" style-hover=\"color:#FFFFFF\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:none;fill:none;stroke:#C9758A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><rect width=\"20\" height=\"20\" x=\"2\" y=\"2\" rx=\"5\" ry=\"5\"><\u002Frect><path d=\"M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z\"><\u002Fpath><line x1=\"17.5\" x2=\"17.51\" y1=\"6.5\" y2=\"6.5\"><\u002Fline><\u002Fsvg>Instagram<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.9\">\n      <div style=\"font-weight:700;color:#FFFFFF;margin-bottom:4px\">Usluge<\u002Fdiv>\n      <sc-for list=\"{{ cats }}\" as=\"c\" hint-placeholder-count=\"6\">\n        <a href=\"#\" sc-camel-on-click=\"{{ c.go }}\" style=\"display:block;color:#EDE6E1\" style-hover=\"color:#FFFFFF\">{{ c.name }}<\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"font-size:14px;line-height:1.9\">\n      <div style=\"font-weight:700;color:#FFFFFF;margin-bottom:4px\">Radno vreme<\u002Fdiv>\n      <div style=\"display:flex;gap:10px;align-items:flex-start\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" style=\"flex:none;margin-top:6px;fill:none;stroke:#C9758A;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 6v6l4 2\"><\u002Fpath><\u002Fsvg>\n        <span>Ponedeljak–petak 09–19h<br>Vikendom ne radimo<\u002Fspan>\n      <\u002Fdiv>\n      <a href=\"#\" sc-camel-on-click=\"{{ goBook }}\" style=\"display:inline-flex;align-items:center;min-height:46px;padding:0 20px;margin-top:12px;border-radius:999px;background:#A8475F;color:#FFFFFF;font-weight:700\" style-hover=\"background:#C9758A;color:#FFFFFF\">Zakažite pregled<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1280px;margin:0 auto;padding:16px clamp(16px,4cqi,48px) 28px;border-top:1px solid #463D3F;font-size:13px;color:#BDB2AE;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between\">\n    <span>© 2026 Poliklinika Materna, Čačak<\u002Fspan>\n    <a href=\"#\" sc-camel-on-click=\"{{ goPrices }}\" style=\"color:#BDB2AE\">Cenovnik<\u002Fa>\n  <\u002Fdiv>\n<\u002Ffooter>\n\n<sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:sticky;bottom:0;z-index:25;display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(250,248,245,0.97);border-top:1px solid #EAE1DC\">\n    <a href=\"tel:+38163380252\" style=\"display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:999px;background:#2B2526;color:#FFFFFF;font-weight:700;font-size:15px\">\n      <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" style=\"fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round\"><path d=\"M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z\"><\u002Fpath><\u002Fsvg>\n      Pozovite\n    <\u002Fa>\n    <a href=\"#\" sc-camel-on-click=\"{{ goBook }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:52px;border-radius:999px;background:#A8475F;color:#FFFFFF;font-weight:700;font-size:15px\">Zakažite<\u002Fa>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;uredjaj&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;auto&quot;,&quot;mobilni&quot;],&quot;default&quot;:&quot;auto&quot;,&quot;tsType&quot;:&quot;'auto'|'mobilni'&quot;,&quot;section&quot;:&quot;Prikaz&quot;},&quot;oznaciPrimere&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sadržaj&quot;},&quot;prikaziProstor&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sadržaj&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Forma&quot;}}\">\nconst IMG = 'https://www.materna.rs/images/';\nconst CATS = [\n  { id: 'trudnoca', name: 'Trudnoća', lead: 'Praćenje trudnoće od prvog pregleda do porođaja, ekspertski 4D ultrazvuk i CTG.', img: IMG + 'vodjenje-trudnoce.jpg' },\n  { id: 'ginekologija', name: 'Ginekologija', lead: 'Redovni i sistematski pregledi, ultrazvuk, PAP test, kolposkopija i savetovanje u menopauzi.', img: IMG + 'konizacija.jpg' },\n  { id: 'sterilitet', name: 'Sterilitet i VTO', lead: 'Ispitivanje uzroka neplodnosti kod oba partnera, inseminacija i priprema za vantelesnu oplodnju.', img: IMG + 'inseminacija.jpg' },\n  { id: 'genetika', name: 'Genetika', lead: 'Prenatalni testovi iz krvi, amniocenteza, biopsija horiona i utvrđivanje očinstva.', img: IMG + 'pre-natalni-testovi-iz-krvi.jpg' },\n  { id: 'intervencije', name: 'Intervencije', lead: 'Dijagnostičke i hirurške intervencije, većina u kratkoj anesteziji.', img: IMG + 'histeroskopija.jpg' },\n  { id: 'specijalisti', name: 'Specijalisti', lead: 'Pedijatar, endokrinolozi, radiolog, anesteziolog, urolog, plastični hirurg i neurohirurg.', img: IMG + 'pedijatrija.jpg' },\n];\nconst G = ['dimitrijevic', 'cindrak', 'isailovic', 'azanjac'];\n// [id, cat, name, desc, price, sample, docs, img, more]\nconst S = [\n  ['4d-ultrazvuk', 'trudnoca', '4D ekspertski ultrazvuk', 'Detaljan ultrazvučni pregled ploda u 2D i 4D tehnici: procena rasta, anatomije i stanja bebe.', 'od 7.000 din', 1, ['azanjac'], 'vodjenje-trudnoce.jpg'],\n  ['vodjenje-trudnoce', 'trudnoca', 'Vođenje trudnoće', 'Prenatalna nega je od velike važnosti za zdravlje i dobrobit vaše bebe. Bez adekvatnih testova i pregleda nema ni bezbedne trudnoće – pa je prva stvar koju treba da uradite nakon što saznate da ste trudni je da se odlučite za svog ginekologa koji će se brinuti o vama i vašoj bebi u narednih devet meseci.', 'od 5.000 din', 1, ['azanjac', 'cindrak'], 'vodjenje-trudnoce.jpg'],\n  ['ctg', 'trudnoca', 'CTG (kardiotokografija)', 'Praćenje otkucaja srca bebe i kontrakcija materice u poslednjem trimestru trudnoće.', '3.000 din', 1, ['azanjac', 'cindrak']],\n  ['patoloska-stanja', 'trudnoca', 'Patološka stanja u trudnoći', 'Praćenje trudnoća sa povišenim rizikom, kao što su povišen pritisak, dijabetes u trudnoći ili zastoj u rastu ploda.', 'od 5.000 din', 1, ['azanjac']],\n  ['ginekoloski-pregled', 'ginekologija', 'Ginekološki pregled', 'Pregled sa ultrazvukom, razgovor o tegobama i plan daljeg lečenja.', '4.000 din', 1, G],\n  ['ginekoloski-4d', 'ginekologija', 'Ginekološki 4D ultrazvuk', 'Ultrazvučni pregled materice i jajnika u 4D tehnici.', '4.500 din', 1, G],\n  ['kolposkopija-pap', 'ginekologija', 'Kolposkopija i PAP test', 'Pregled grlića materice pod uvećanjem i uzimanje brisa za citološku analizu.', '4.000 din', 1, G, 'konizacija.jpg'],\n  ['sistematski', 'ginekologija', 'Godišnji sistematski pregled', 'Ginekološki pregled, ultrazvuk, PAP test i kolposkopija u jednom terminu.', '8.000 din', 1, G],\n  ['menopauza', 'ginekologija', 'Menopauza', 'Savetovanje i terapija tegoba u perimenopauzi i menopauzi.', '4.000 din', 1, G],\n  ['spirala', 'ginekologija', 'Aplikacija spirale', 'Postavljanje intrauterinog uloška uz ultrazvučnu proveru položaja.', 'od 10.000 din', 1, ['dimitrijevic', 'azanjac']],\n  ['sterilitet-zene', 'sterilitet', 'Sterilitet kod žena', 'Ispitivanje uzroka neplodnosti:
